          <p class="mb-0 mt-4 text-black">Informe o e-mail que será enviado o link de redefinição de senha.</p>

          <form action="" class="pt-0">

              </div>
              <div class="modal-body" id="bodyModal"></div>
              <div class="modal-footer">

            </div>
          </div>
